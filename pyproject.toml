[project]
name = "primitive-db"
version = "0.1.0"
description = "Простая консольная база данных"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Амуланга Дорджиева"}
]
dependencies = [
    "prompt>=0.4.1",
    "prettytable",
]

[project.scripts]
database = "primitive_db.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
